<!-- 広告枠。site.config.json の ads.enabled が true で、かつ ads.slots に枠IDがあるときだけ出力される。 -->
<div class="ad-slot ad-slot--{{name}}" aria-label="広告">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{client}}"
       data-ad-slot="{{slot}}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
