# main に push すると、検証 → ビルド → GitHub Pages への公開を自動で行う。
# 初回だけ GitHub の Settings → Pages → Source を「GitHub Actions」にしてください。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@v5

      - name: Verify questions
        run: node verify.js

      # ベースURLは、リポジトリ変数 SITE_BASE_URL があればそれを、なければ GitHub Pages のURLを使う。
      # 独自ドメインにしたら Settings → Secrets and variables → Actions → Variables に
      # SITE_BASE_URL（例: https://example.com/）を登録するだけで切り替わる。
      - name: Build site
        run: node build.js
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
